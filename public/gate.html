<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enter Access Code — One Coin Night Tour</title>
<link rel="stylesheet" href="shared/tour.css" />
</head>
<body>
<div class="wrap">
  <div class="eyebrow">One Coin Night Tour</div>
  <h1 class="title">Enter your access code</h1>
  <p class="subtitle">You received this code after purchase. It unlocks the full tour on this device.</p>

  <div class="card">
    <input id="codeInput" type="text" inputmode="latin" autocapitalize="characters"
      placeholder="e.g. NIGHT-XXXX"
      style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--line);
             background:rgba(255,255,255,0.03);color:var(--paper);font-family:var(--mono);
             font-size:16px;letter-spacing:.06em;margin-bottom:14px;" />
    <button id="submitBtn" class="btn btn-primary" style="width:100%;">Unlock tour</button>
    <p id="errorMsg" style="color:var(--torii-soft);font-size:13px;margin-top:12px;display:none;"></p>
  </div>

  <p class="subtitle">Don't have a code yet? <a href="purchase/index.html" style="color:var(--lantern);">Purchase the tour — ¥500</a></p>

  <div class="footer-note">EAST RIVER 31 LLC</div>
</div>

<script>
  /* Firebase Realtime Database wiring is below — see DATABASE_URL and
     verifyCode(). This project uses its own Firebase project, separate from
     the Osaka Castle Tour's. */

  /**
   * Access code verification against this project's Firebase Realtime
   * Database. Each code allows up to 3 uses (matching the Osaka Castle Tour
   * pattern of sharing one code across a small group). Database structure:
   *   accessCodes/<CODE>/maxUses  (number, set when the code is issued)
   *   accessCodes/<CODE>/uses     (number, starts at 0, incremented on each
   *                                successful unlock)
   */
  var DATABASE_URL = "https://ishikiri-ikoma-night-tour-default-rtdb.asia-southeast1.firebasedatabase.app";

  var params = new URLSearchParams(window.location.search);
  var nextPage = params.get("next") || "route-select.html";

  async function verifyCode(rawCode) {
    var code = rawCode.trim().toUpperCase();
    if (!code) return { ok: false, reason: "empty" };

    var res = await fetch(DATABASE_URL + "/accessCodes/" + encodeURIComponent(code) + ".json");
    var data = await res.json();

    if (!data) return { ok: false, reason: "not_found" };

    var maxUses = typeof data.maxUses === "number" ? data.maxUses : 0;
    var uses = typeof data.uses === "number" ? data.uses : 0;

    if (uses >= maxUses) return { ok: false, reason: "exhausted" };

    // Attempt to claim one use. The database rules only accept this write if
    // it's exactly (current uses + 1) and stays within maxUses, so a race
    // between two people redeeming the same code near its limit fails safely
    // rather than over-granting access.
    var writeRes = await fetch(
      DATABASE_URL + "/accessCodes/" + encodeURIComponent(code) + "/uses.json",
      { method: "PUT", body: JSON.stringify(uses + 1) }
    );
    if (!writeRes.ok) return { ok: false, reason: "exhausted" };

    return { ok: true };
  }

  document.getElementById("submitBtn").addEventListener("click", async function () {
    var code = document.getElementById("codeInput").value;
    var errorEl = document.getElementById("errorMsg");
    var result = await verifyCode(code);
    if (result.ok) {
      sessionStorage.setItem("nightTourAccessGranted", "true");
      window.location.href = nextPage;
    } else {
      var messages = {
        empty: "Enter your access code first.",
        not_found: "That code didn't match. Check for typos, or purchase a code below.",
        exhausted: "This code has already been used its full number of times."
      };
      errorEl.textContent = messages[result.reason] || "Something went wrong — try again.";
      errorEl.style.display = "block";
    }
  });

  document.getElementById("codeInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("submitBtn").click();
  });
</script>
</body>
</html>
